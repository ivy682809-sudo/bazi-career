<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>职场出厂设置 · 28题测出你的工作体质</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#faf9f6;color:#1a1a1a;min-height:100vh}
header{position:sticky;top:0;z-index:50;background:rgba(250,249,246,.9);backdrop-filter:blur(8px);border-bottom:1px solid #e7e5e4;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:center}
header h1{font-size:17px;font-weight:600;color:#1c1917;letter-spacing:.5px}
main{max-width:600px;margin:0 auto;padding:24px 16px 80px}
/* intro */
.intro{text-align:center;padding:32px 0}
.intro .emoji{font-size:48px;margin-bottom:16px}
.intro h2{font-size:22px;font-weight:700;margin-bottom:8px}
.intro p{color:#78716c;font-size:14px;line-height:1.7;max-width:340px;margin:0 auto}
.intro .badges{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.intro .badges span{background:#f5f5f4;color:#78716c;font-size:11px;padding:4px 10px;border-radius:12px}
/* progress */
.progress-wrap{background:#e7e5e4;border-radius:4px;height:4px;margin-bottom:24px;overflow:hidden}
.progress-bar{height:4px;background:#1c1917;border-radius:4px;transition:width .3s}
.progress-num{text-align:center;font-size:12px;color:#a8a29e;margin-bottom:8px}
/* question */
.q-card{background:#fff;border-radius:12px;border:1px solid #e7e5e4;padding:28px 24px;margin-bottom:16px}
.q-num{font-size:12px;color:#a8a29e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:17px;font-weight:600;color:#1c1917;line-height:1.7;margin-bottom:24px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:2px solid #e7e5e4;border-radius:10px;background:#fff;font-size:14px;color:#44403c;line-height:1.5;cursor:pointer;transition:all .15s}
.opt:hover{border-color:#a8a29e}
.opt.selected{border-color:#1c1917;background:#fafaf9}
.opt .opt-letter{display:inline-block;width:22px;height:22px;border-radius:11px;background:#f5f5f4;text-align:center;line-height:22px;font-size:11px;font-weight:600;color:#78716c;margin-right:10px;flex-shrink:0}
.opt.selected .opt-letter{background:#1c1917;color:#fff}
/* result */
.result-wrap{text-align:center}
.result-card{border-radius:16px;border:1px solid #e7e5e4;background:#fff;padding:32px 24px;margin-bottom:16px}
.result-emoji{font-size:64px;margin-bottom:12px}
.result-type{font-size:28px;font-weight:700;color:#1c1917;margin-bottom:4px}
.result-sub{font-size:14px;color:#78716c;margin-bottom:20px}
.result-desc{font-size:15px;color:#44403c;line-height:1.8;text-align:left;margin-bottom:24px}
.result-traits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.result-traits span{background:#f5f5f4;padding:6px 14px;border-radius:20px;font-size:13px;color:#57534e}
.match-box{border-radius:12px;border:1px solid #e7e5e4;background:#fafaf9;padding:20px;margin-bottom:12px;text-align:left}
.match-box h4{font-size:13px;font-weight:600;color:#1c1917;margin-bottom:8px}
.match-box p{font-size:13px;color:#57534e;line-height:1.7}
.score-bar{height:6px;background:#e7e5e4;border-radius:3px;margin:12px 0;overflow:hidden}
.score-fill{height:6px;border-radius:3px;transition:width .6s}
.score-fill.high{background:#10b981}
.score-fill.mid{background:#6366f1}
.score-fill.low{background:#ef4444}
.type-dist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0}
.type-dist .bar-col{text-align:center}
.type-dist .bar-col .bar-h{background:#f5f5f4;border-radius:6px 6px 0 0;margin:0 auto 4px;transition:height .6s}
.type-dist .bar-col .bar-label{font-size:10px;color:#a8a29e}
.type-dist .bar-col .bar-pct{font-size:11px;font-weight:600;color:#1c1917}
/* CTA */
.cta-box{border-radius:12px;border:1px solid #e7e5e4;background:#fff;padding:24px;text-align:center;margin-top:16px}
.cta-box p{font-size:14px;color:#57534e;line-height:1.7;margin-bottom:16px}
.cta-box .btn{display:inline-block;border-radius:8px;background:#1c1917;color:#fff;padding:12px 24px;font-size:15px;font-weight:500;text-decoration:none;border:none;cursor:pointer}
.cta-box .btn:hover{background:#292524}
.btn-outline{display:inline-block;border-radius:8px;border:2px solid #e7e5e4;background:transparent;color:#1c1917;padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;margin-left:8px;text-decoration:none}
.btn-outline:hover{border-color:#1c1917}
.dim{font-size:12px;color:#a8a29e;text-align:center;margin-top:8px}
footer{text-align:center;padding:32px 0;color:#a8a29e;font-size:12px;border-top:1px solid #f5f5f4;margin-top:32px}
</style>
</head>
<body>

<header><h1>职场出厂设置测试</h1></header>

<main id="app">
  <!-- intro -->
  <div id="intro-screen">
    <div class="intro">
      <div class="emoji">🧬</div>
      <h2>28 道题 · 测出你的工作体质</h2>
      <p>不是 MBTI。不是性格测试。是你面对工作的默认反应——那些你不假思索的选择，早就暴露了你适合什么样的工作。</p>
      <div class="badges"><span>2 分钟完成</span><span>场景选择题</span><span>无标准答案</span></div>
    </div>
    <button class="opt" style="text-align:center;font-size:16px;font-weight:600;padding:16px;margin-top:8px;border-color:#1c1917" onclick="startQuiz()">开始测试</button>
  </div>

  <!-- quiz -->
  <div id="quiz-screen" style="display:none">
    <div class="progress-num" id="progress-num">1 / 28</div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:3%"></div></div>
    <div class="q-card" id="q-card"></div>
  </div>

  <!-- result -->
  <div id="result-screen" style="display:none"></div>
</main>

<footer>所有计算在浏览器本地完成 · 不上传任何数据</footer>

<script>
// ============================================================
// 28 道题
// ============================================================

const QUESTIONS = [
  {q:"周一早上到公司，你最可能先做什么？", opts:[
    {t:"按优先级列出今日待办，先做最难的那个", s:{土:3,金:2}},
    {t:"先刷一遍邮件和信息，看看有什么紧急的再说", s:{水:3,火:2}},
    {t:"泡杯咖啡，跟同事聊两句周末的事再开工", s:{火:3,木:2}},
    {t:"打开昨天做到一半的东西，顺着思路继续往下", s:{水:3,金:2}}
  ]},
  {q:"下午三点突然接了一个新任务，明早要交。你的第一反应？", opts:[
    {t:"立刻拆任务、排时间、拉人、开干", s:{土:3,金:2}},
    {t:"先不理。手头的事做完再说——明早的事明早再想", s:{木:3,火:2}},
    {t:"跟领导确认优先级：这个新任务和我手上的哪个更重要", s:{金:3,土:2}},
    {t:"心里烦，但还是接了。开始做但做的过程中一直在想为什么总是我", s:{火:3,水:2}}
  ]},
  {q:"会议上大家在讨论一个你完全不了解的领域。你怎么做？", opts:[
    {t:"安静听。不是不想发言——是不懂的东西不开口", s:{金:3,水:2}},
    {t:"记下来，回去查。下次开会我就能说了", s:{水:3,木:1}},
    {t:"还是说了几句。不一定对——但不说憋着难受", s:{火:3,木:2}},
    {t:"快速找了个能切入的点，把话题拉回我熟悉的领域", s:{土:3,金:1}}
  ]},
  {q:"加班到九点回到家。你觉得最放松的事情是？", opts:[
    {t:"脑子里还在复盘今天没解决的问题", s:{金:3,水:2}},
    {t:"一个人待着。不说话。发呆也好", s:{水:3,土:1}},
    {t:"跟朋友/家人打电话讲讲今天发生了什么", s:{火:3,木:2}},
    {t:"翻翻社交媒体看看别人今天做了什么", s:{火:2,木:3}}
  ]},
  {q:"同事做了一个你觉得明显有问题的方案，但领导似乎没看出来。你怎么办？", opts:[
    {t:"会后单独找同事说。不是当众指出——是给他留面子", s:{土:3,金:1}},
    {t:"当场提出来。有逻辑漏洞不说出来不是你的风格", s:{金:3,火:2}},
    {t:"算了。领导都没说我操什么心", s:{水:2,木:2}},
    {t:"会后私聊。但不是指出问题——是问他怎么想的，顺着帮他理", s:{木:3,水:2}}
  ]},
  {q:"周五下午六点。你手上还有一件事没做完，但截止日期是周一。你倾向于？", opts:[
    {t:"做完再走。不是加班狂——是这件事搁在心里周末过不好", s:{金:3,土:2}},
    {t:"关电脑走人。周末是周末。周一再做也来得及", s:{木:3,火:2}},
    {t:"看心情。这周太累了就走，还行就做完", s:{火:2,水:2}},
    {t:"列好周一的计划再走。知道自己回来先做什么就不慌", s:{土:3,金:1}}
  ]},
  {q:"你更受不了哪种工作环境？", opts:[
    {t:"方向天天变。上周定的方案下周推翻了重来", s:{土:3,金:2}},
    {t:"一个人埋头做三个月没人知道你在干嘛", s:{火:3,木:2}},
    {t:"每天重复差不多的事，看不出进步", s:{水:3,木:2}},
    {t:"一堆人整天开会讨论，但没人做决定", s:{金:3,土:2}}
  ]},
  {q:"朋友问你「你适合做什么」，你一般怎么回答？", opts:[
    {t:"我也想知道啊。还在找", s:{火:2,水:2}},
    {t:"说不太清楚——但我知道自己不适合什么", s:{金:2,水:3}},
    {t:"我知道。但就是现在做的不太对", s:{木:2,火:3}},
    {t:"我知道。但不太想说——说了别人觉得我不务实", s:{土:2,金:3}}
  ]},
  {q:"团队分工的时候，你通常会选哪个角色？", opts:[
    {t:"出去收集信息/跟外部门对接/做汇报", s:{火:3,木:2}},
    {t:"把任务拆成步骤，列好每个人负责什么", s:{土:3,金:2}},
    {t:"负责最核心的那份产出——方案/报告/成品", s:{金:3,水:2}},
    {t:"负责研究/查资料/做储备——产出之前的那步", s:{水:3,木:2}}
  ]},
  {q:"有人当众夸你做得不错。你的反应？", opts:[
    {t:"不是虚伪——是真的在想「我哪做得好」", s:{金:2,水:3}},
    {t:"挺开心的。被看到就是被看到", s:{火:3,木:2}},
    {t:"谢了，然后立刻把功劳分给团队", s:{土:3,金:1}},
    {t:"觉得有点尴尬。不是不喜欢——是不知道怎么反应", s:{水:2,土:2}}
  ]},
  {q:"你觉得自己最值钱的能力是什么（不是写在简历上的那种）？", opts:[
    {t:"看人准。聊一次就知道这个人靠不靠谱", s:{木:3,火:2}},
    {t:"做事不漏。一件事交给我就不用操心了", s:{金:3,土:2}},
    {t:"学得快。进入一个新领域比大部分人快一倍", s:{水:3,木:2}},
    {t:"能把完全不同的人捏在一起做事", s:{土:3,火:2}}
  ]},
  {q:"咖啡店服务员给你做错了单。你怎么处理？", opts:[
    {t:"算了。不是宽容——是不想为这点事多纠缠", s:{水:2,木:2}},
    {t:"礼貌指出。这个不是我要的，麻烦换一下", s:{金:2,土:2}},
    {t:"直接说。不是态度不好——是这件事本来就不该纠结", s:{火:3,金:1}},
    {t:"算了但心里会想下次别来这家了", s:{水:2,火:2}}
  ]},
  {q:"接下来三个月你最想完成的一件事？", opts:[
    {t:"学一个新技能/考一个证/搞懂一个新领域", s:{水:3,木:2}},
    {t:"把手头最大的那个项目做完、做漂亮", s:{金:3,土:2}},
    {t:"开始自己的side project/副业/创作", s:{木:3,火:2}},
    {t:"升职/转岗/跳到更合适的位置", s:{土:2,火:2}}
  ]},
  {q:"小组项目最后阶段，有人拖后腿但时间来不及了。你怎么做？", opts:[
    {t:"直接帮他做他那部分。不是老好人——是项目不能砸", s:{土:3,金:2}},
    {t:"跟他谈。不是指责——是搞清楚为什么拖，能不能最后几天补上", s:{木:3,水:2}},
    {t:"按原样交。不是狠心——是每个人为自己的部分负责", s:{金:2,火:2}},
    {t:"跟领导提前报备风险。不是告状——是让人心里有数", s:{土:2,金:3}}
  ]},
  {q:"周五晚上公司团建。你内心最真实的想法是？", opts:[
    {t:"去吧。社交也是工作的一部分。但到了就想早点走", s:{金:2,水:2}},
    {t:"去。不知道水，但往往喝到一半发现还挺开心的", s:{火:3,木:2}},
    {t:"不去。周五晚上是我的时间——不愿意被占用", s:{水:3,土:1}},
    {t:"去吧。不是喜欢——是团队需要我出现，这是一种支持", s:{土:3,火:2}}
  ]},
  {q:"你刷手机的时候，什么样的内容更容易让你停下滑？", opts:[
    {t:"一个你完全不认识的领域——好奇你是怎么做到的", s:{水:3,木:2}},
    {t:"一个人讲自己怎么从低谷爬上来", s:{火:2,木:3}},
    {t:"一个观点鲜明的分析——不管同不同意，先看完", s:{金:3,火:1}},
    {t:"一个系统性的整理——比如合集/攻略/清单", s:{土:3,金:2}}
  ]},
  {q:"过年回家亲戚问你「你们公司怎么样？」你怎么说？", opts:[
    {t:"还行。就那样。不详细说——不是不想说，是说不明白", s:{水:2,火:2}},
    {t:"挺好的。说几个具体的有趣的事情", s:{火:3,木:2}},
    {t:"分析一下行业现状。不是装专业——是这个问题我觉得可以聊得更深", s:{金:3,水:2}},
    {t:"挺好的。然后立刻把话题转回他们——最近你们怎么样", s:{土:3,火:1}}
  ]},
  {q:"你在朋友圈或社交媒体上更倾向于分享什么？", opts:[
    {t:"观点。看到什么东西觉得有道理，想表达", s:{金:3,火:2}},
    {t:"生活碎片。今天去哪了、吃了什么、一个瞬间", s:{木:3,火:2}},
    {t:"不太发。但会认真看别人的", s:{水:3,土:1}},
    {t:"成果。做完的东西、拿到的成绩", s:{火:3,金:1}}
  ]},
  {q:"一个项目你从零开始做。哪个阶段你最享受？", opts:[
    {t:"开头——从无到有的那一刻。想法变成实体的瞬间", s:{木:3,火:2}},
    {t:"打磨——反复改、反复调，做到自己满意的那个状态", s:{金:3,水:2}},
    {t:"进程中的交流——跟别人讨论方案时的碰撞", s:{火:3,木:1}},
    {t:"收尾——所有东西都归位、归档、交付的那一刻", s:{土:3,金:2}}
  ]},
  {q:"你现在的工作中，什么让你最累？", opts:[
    {t:"重复。做一模一样的事第N遍", s:{水:3,火:2}},
    {t:"方向不确定。今天要这样明天要那样", s:{土:3,金:2}},
    {t:"做了没人知道。付出了但没有反馈", s:{火:3,木:1}},
    {t:"没有深度。做的都是表面的事", s:{水:2,金:2}}
  ]},
  {q:"如果明天开始完全自由工作——没有打卡、没有领导、自己定节奏。你觉得自己会？", opts:[
    {t:"挺自由的。但可能需要一个自己的框架——完全没结构我会慌", s:{土:3,金:2}},
    {t:"挺自由的。但可能会想接更多项目、做更多事——停不下来", s:{木:3,火:2}},
    {t:"终于。我的节奏终于自己说了算", s:{水:3,木:1}},
    {t:"有点害怕。不是因为能力——是因为没有人给你反馈了", s:{火:3,水:2}}
  ]},
  {q:"你更在意哪一种评价？", opts:[
    {t:"「这人做事靠谱」", s:{金:3,土:2}},
    {t:"「跟他一起工作挺开心的」", s:{火:3,木:2}},
    {t:"「这人比我想的深」", s:{水:3,金:1}},
    {t:"「他总能想到别人没想到的」", s:{木:3,火:1}}
  ]},
  {q:"入职第一天。你最关心什么？", opts:[
    {t:"流程——用什么工具、走什么审批、找什么人", s:{土:3,金:2}},
    {t:"氛围——团队里的人是什么性格、好不好相处", s:{火:3,木:2}},
    {t:"深度——这个业务到底是怎么运作的，为什么这样设计", s:{水:3,金:2}},
    {t:"方向——今年最重要的目标是什么，我负责哪一块", s:{金:3,土:2}}
  ]},
  {q:"你跟上级意见不同时，一般怎么处理？", opts:[
    {t:"直接说。不是冒犯——是逻辑上我觉得这里有问题", s:{金:3,火:2}},
    {t:"先执行。不是服气——等执行完用结果说话", s:{土:3,水:2}},
    {t:"私下聊。不是不敢当众说——是方式会影响关系", s:{木:3,土:1}},
    {t:"看情况。如果大方向没问题就算了，如果有硬伤再说", s:{水:2,金:2}}
  ]},
  {q:"你在会议上更倾向于？", opts:[
    {t:"少说多记。核心问题发一次言就够了", s:{金:3,水:2}},
    {t:"看氛围。没有人说话的时候我会说——不是因为想说，是不想让会冷掉", s:{土:3,火:2}},
    {t:"有感觉就多说。说不爽了继续。说完回来改方案", s:{火:3,木:2}},
    {t:"不太说。但脑子里一直在转——散会了再单独跟关键人聊", s:{水:3,木:1}}
  ]},
  {q:"一个人出差。你最享受的部分是？", opts:[
    {t:"路上没人打扰的深度思考时间", s:{水:3,金:2}},
    {t:"到了新地方。陌生环境让脑子活过来", s:{木:3,火:2}},
    {t:"见不同的人。每一个都是新视角", s:{火:3,木:1}},
    {t:"一切都在计划中——航班、酒店、行程，顺畅就舒服", s:{土:3,金:2}}
  ]},
  {q:"你觉得自己最大的劣势是什么？", opts:[
    {t:"太在意别人的感受，有时候自己累到不行了还没说", s:{土:2,火:2}},

// ============================================================
// 测试逻辑
// ============================================================

let currentQ = 0;
let scores = {金:0,木:0,水:0,火:0,土:0};
let selectedOpt = -1;

function startQuiz(){
  currentQ = 0;
  scores = {金:0,木:0,水:0,火:0,土:0};
  selectedOpt = -1;
  document.getElementById('intro-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='block';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[currentQ];
  const card = document.getElementById('q-card');
  const cnt = currentQ+1;
  document.getElementById('progress-num').textContent = cnt+' / 28';
  document.getElementById('progress-bar').style.width = (cnt/28*100)+'%';
  selectedOpt = -1;

  card.innerHTML = `
    <div class="q-num">第 ${cnt} 题</div>
    <div class="q-text">${q.q}</div>
    <div class="options">
      ${q.opts.map((o,i) => `
        <button class="opt" id="opt-${i}" onclick="selectOption(${i})">
          <span class="opt-letter">${'ABCD'[i]}</span>${o.t}
        </button>
      `).join('')}
    </div>
  `;
}

function selectOption(idx){
  if(selectedOpt >= 0) return;
  selectedOpt = idx;
  document.querySelectorAll('.opt').forEach(e=>e.classList.remove('selected'));
  document.getElementById('opt-'+idx).classList.add('selected');

  const q = QUESTIONS[currentQ];
  const s = q.opts[idx].s;
  for(const [k,v] of Object.entries(s)) scores[k] += v;

  setTimeout(()=>{
    currentQ++;
    if(currentQ >= 28) showResult();
    else renderQuestion();
  }, 300);
}

function getTopType(){
  let max=0, top='金';
  for(const [k,v] of Object.entries(scores)){ if(v>max){max=v;top=k;} }
  return {type:top, score:max};
}

function getTypeDist(){
  const total = Object.values(scores).reduce((a,b)=>a+b,0);
  const order = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  return {order, total};
}

function showResult(){
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('result-screen').style.display='block';

  const {type, score} = getTopType();
  const {order, total} = getTypeDist();
  const t = TYPES[type];

  const typeEmojis = {金:'⚙️',木:'🌱',水:'🌊',火:'🔥',土:'🏛️'};

  document.getElementById('result-screen').innerHTML = `
    <div class="result-wrap">
      <div class="result-card">
        <div class="result-emoji">${t.emoji}</div>
        <div class="result-type">${t.name}</div>
        <div class="result-sub">${t.essence}</div>

        <div class="type-dist">
          ${order.map(([k,v]) => `
            <div class="bar-col">
              <div class="bar-label">${typeEmojis[k]}</div>
              <div class="bar-h" id="bar-${k}"></div>
              <div class="bar-pct">${Math.round(v/total*100)}%</div>
            </div>
          `).join('')}
        </div>

        <div class="result-desc">${t.desc}</div>

        <div class="result-traits">
          ${t.traits.map(tr=>'<span>'+tr+'</span>').join('')}
        </div>
      </div>

      <div class="match-box">
        <h4>适配方向</h4>
        <p>${t.match}</p>
      </div>

      <div class="cta-box">
        <p>28 道题给你一个方向。想要更精确的分析——你的个人能量完整档案 + 11个行业逐一匹配 + 三阶调整方案——主页有入口。</p>
        <button class="btn" onclick="scrollToTop()">再做一次</button>
        <span class="dim" style="display:block;margin-top:8px">也可以分享给朋友看看他们是什么类型</span>
      </div>
    </div>
  `;

  // animate bars
  setTimeout(()=>{
    order.forEach(([k,v])=>{
      const bar = document.getElementById('bar-'+k);
      if(bar) bar.style.height = (v/total*100)+'px';
    });
  },200);
}

function scrollToTop(){
  document.getElementById('result-screen').style.display='none';
  document.getElementById('intro-screen').style.display='block';
  window.scrollTo(0,0);
}
</script>
