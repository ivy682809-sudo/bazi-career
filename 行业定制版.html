// ============================================================
// 八字引擎
// ============================================================
const STEMS=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const STEM_ELEMENT={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
const ELE_BADGES={'金':'badge-gold','木':'badge-green','水':'badge-blue','火':'badge-red','土':'badge-amber'};

function daysBetween(y1,m1,d1,y2,m2,d2){return Math.floor((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000);}
const SOLAR_TERMS={2:[4,4,4,5],3:[6,5,5,6],4:[5,4,4,5],5:[6,5,5,6],6:[6,5,5,6],7:[7,7,7,8],8:[8,7,7,8],9:[8,7,7,8],10:[8,8,8,9],11:[7,7,8,8],12:[7,7,7,8],1:[6,5,5,6]};
function getTermDay(y,m){const arr=SOLAR_TERMS[m];return arr?arr[y%4]||arr[0]:6;}
const YEAR_STEM_MONTH={0:2,5:2,1:4,6:4,2:6,7:6,3:8,8:8,4:0,9:0};
const DAY_STEM_HOUR={0:0,5:0,1:2,6:2,2:4,7:4,3:6,8:6,4:8,9:8};

function calculateBazi(year,month,day,hour){
  const dayDiff=daysBetween(1900,1,1,year,month,day);
  const dsi=((0+dayDiff)%10+10)%10;
  const dbi=((10+dayDiff)%12+12)%12;
  const lichun=getTermDay(year,2);
  const isBeforeLichun=month<2||(month===2&&day<lichun);
  const effYear=isBeforeLichun?year-1:year;
  const ysi=(effYear-4)%10;
  const ybi=(effYear-4)%12;
  let mbi=month%12;
  const termDay=getTermDay(year,month);
  if(day<termDay)mbi=(mbi+11)%12;
  const firstStem=YEAR_STEM_MONTH[ysi];
  const msi=(firstStem+(mbi-2+12)%12)%10;
  const hbi=Math.floor((hour+1)/2)%12;
  const hsi=(DAY_STEM_HOUR[dsi]+hbi)%10;
  return{
    yearPillar:STEMS[ysi]+BRANCHES[ybi],
    monthPillar:STEMS[msi]+BRANCHES[mbi],
    dayPillar:STEMS[dsi]+BRANCHES[dbi],
    hourPillar:STEMS[hsi]+BRANCHES[hbi],
    dayMaster:STEMS[dsi],
    dayElement:STEM_ELEMENT[STEMS[dsi]]
  };
}

let currentBazi = null;
let currentIndustry = null;

function doBazi(){
  const y=parseInt(document.getElementById('in-year').value);
  const m=parseInt(document.getElementById('in-month').value);
  const d=parseInt(document.getElementById('in-day').value);
  const result=calculateBazi(y,m,d,12);
  currentBazi=result;
  const el=result.dayElement;
  const badge=ELE_BADGES[el];
  document.getElementById('bazi-result').innerHTML=`
    <div class="result">
      <div class="master-card">
        <span class="badge ${badge}">日主</span>
        <div class="master">${result.dayMaster} · ${el}</div>
        <p class="desc">框架感先于感受。精密、秩序、不可见但不可或缺。</p>
      </div>
      <p style="text-align:center;font-size:14px;color:#44403c;margin-bottom:12px">选择你要深度分析的行业：</p>

          <button class="ind-btn" onclick="pickIndustry('${k}')">${v.name}</button>

    </div>
  `;
}

function pickIndustry(key){
  currentIndustry=key;
  if(isUnlocked()){
    showReport();
  } else {
    showPaywall();
  }
}

function showPaywall(){

  document.getElementById('bazi-result').innerHTML=`

function showReport(){

        <p>${td.shortTerm}</p>
      </div>
      <div class="report-card">
        <h3>🗺️ 长期职业路径</h3>

      </div>

        <button class="btn" onclick="resetAll()" style="max-width:200px">重新选择</button>

    </div>
  `;
}

function resetAll(){
  currentBazi=null;currentIndustry=null;
  document.getElementById('bazi-result').innerHTML='';
}

async function verifyCode(code){const e=new TextEncoder();const d=e.encode(code.trim().toUpperCase());const h=await crypto.subtle.digest('SHA-256',d);const a=Array.from(new Uint8Array(h));return VALID_HASHES.includes(a.map(b=>b.toString(16).padStart(2,'0')).join(''));}

async function handleUnlock(){
  const input=document.getElementById('unlock-input');
  const msg=document.getElementById('unlock-msg');
  if(!input)return;
  const code=input.value.trim();
  if(!code||code.length<6){msg.textContent='请输入完整的解锁码';msg.className='unlock-msg error';return;}
  msg.textContent='验证中...';msg.className='unlock-msg';
  const valid=await verifyCode(code);
  if(valid){setUnlocked();showReport();}
  else{msg.textContent='解锁码无效，请检查后重试';msg.className='unlock-msg error';}
}
