<style>

<body>

<header><h1>行业深度定制 · 日主×行业</h1></header>

<main id="app">
  <div id="step1">
    <div class="card">
      <h2 style="font-size:18px">输入生日，查出你的日主</h2>
      <div class="input-grid">
        <div><label class="block">年</label><input type="number" id="in-year" min="1900" max="2100" value="2000"></div>
        <div><label class="block">月</label><input type="number" id="in-month" min="1" max="12" value="6"></div>
        <div><label class="block">日</label><input type="number" id="in-day" min="1" max="31" value="15"></div>
      </div>
      <div class="input-grid">
        <div><label class="block">时 (0-23)</label><input type="number" id="in-hour" min="0" max="23" value="12"></div>
        <div>
          <label class="block">性别</label>
          <select id="in-gender" style="width:100%;border-radius:8px;border:1px solid #e7e5e4;padding:10px;font-size:18px;font-weight:500;color:#1c1917;background:#fff;outline:none;text-align:center">
            <option value="男">男</option>
            <option value="女" selected>女</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end"><p style="font-size:12px;color:#a8a29e;padding-bottom:12px">不知道出生时间默认午时（12:00），对日主无影响</p></div>
      </div>
      <button class="btn" onclick="doBazi()">查看我的日主</button>
      <p class="dim">输入公历生日，所有计算在浏览器本地完成</p>
    </div>
    <div id="bazi-result"></div>
  </div>
</main>

<script>
// ============================================================
// 八字引擎
// ============================================================
const STEMS=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const STEM_ELEMENT={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
const ELE_BADGES={'金':'badge-gold','木':'badge-green','水':'badge-blue','火':'badge-red','土':'badge-amber'};

function daysBetween(y1,m1,d1,y2,m2,d2){return Math.floor((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000);}
const SOLAR_TERMS={2:[4,4,4,5],3:[6,5,5,6],4:[5,4,4,5],5:[6,5,5,6],6:[6,5,5,6],7:[7,7,7,8],8:[8,7,7,8],9:[8,7,7,8],10:[8,8,8,9],11:[7,7,8,8],12:[7,7,7,8],1:[6,5,5,6]};
function getTermDay(y,m){const arr=SOLAR_TERMS[m];return arr?arr[y%4]||arr[0]:6;}
const YEAR_STEM_MONTH={0:2,5:2,1:4,6:4,2:6,7:6,3:8,8:8,4:0,9:0};
const DAY_STEM_HOUR={0:0,5:0,1:2,6:2,2:4,7:4,3:6,8:6,4:8,9:8};

function calculateBazi(year,month,day,hour){
  const dayDiff=daysBetween(1900,1,1,year,month,day);
  const dsi=((0+dayDiff)%10+10)%10;
  const dbi=((10+dayDiff)%12+12)%12;
  const lichun=getTermDay(year,2);
  const isBeforeLichun=month<2||(month===2&&day<lichun);
  const effYear=isBeforeLichun?year-1:year;
  const ysi=(effYear-4)%10;
  const ybi=(effYear-4)%12;
  let mbi=month%12;
  const termDay=getTermDay(year,month);
  if(day<termDay)mbi=(mbi+11)%12;
  const firstStem=YEAR_STEM_MONTH[ysi];
  const msi=(firstStem+(mbi-2+12)%12)%10;
  const hbi=Math.floor((hour+1)/2)%12;
  const hsi=(DAY_STEM_HOUR[dsi]+hbi)%10;
  return{
    yearPillar:STEMS[ysi]+BRANCHES[ybi],
    monthPillar:STEMS[msi]+BRANCHES[mbi],
    dayPillar:STEMS[dsi]+BRANCHES[dbi],
    hourPillar:STEMS[hsi]+BRANCHES[hbi],
    dayMaster:STEMS[dsi],
    dayElement:STEM_ELEMENT[STEMS[dsi]]
  };
}

// ============================================================
// 身强身弱 + 喜用神分析
// ============================================================

function getStrength(dayElement, monthBranch, dayBranch, hourBranch, yearBranch,
                     yearStem, monthStem, dayStem, hourStem,
                     gender, year, month) {
  // ====== 地支藏干表 ======
  const BG = {
    子:{主:'癸'}, 丑:{主:'己',中:'癸',余:'辛'}, 寅:{主:'甲',中:'丙',余:'戊'},
    卯:{主:'乙'}, 辰:{主:'戊',中:'乙',余:'癸'}, 巳:{主:'丙',中:'戊',余:'庚'},
    午:{主:'丁',中:'己'}, 未:{主:'己',中:'丁',余:'乙'}, 申:{主:'庚',中:'壬',余:'戊'},
    酉:{主:'辛'}, 戌:{主:'戊',中:'辛',余:'丁'}, 亥:{主:'壬',中:'甲'}
  };
  // ====== 五行映射 ======
  const B2E={寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水',子:'水',丑:'土'};
  const S2E={甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水'};
  const SEASON={木:['寅','卯','辰'],火:['巳','午','未'],金:['申','酉','戌'],水:['亥','子','丑'],土:['辰','未','戌','丑']};
  // ====== 五行生克链 ======
  const g={木:'火',火:'土',土:'金',金:'水',水:'木'};
  const b={木:'水',火:'木',土:'火',金:'土',水:'金'};
  const r={木:'土',火:'金',土:'水',金:'木',水:'火'};
  const rb={木:'金',火:'水',土:'木',金:'火',水:'土'};

  const el=dayElement;
  const detail=[], scoreDetail=[];

  // ① 月支得令（同五行季节）→ +3
  const s1=SEASON[el]?.includes(monthBranch)||false;
  if(s1){detail.push('月支得令');scoreDetail.push('+3');}

  // ② 日支同五行（日柱坐根）→ +2
  const s2=B2E[dayBranch]===el;
  if(s2){detail.push('日支通根');scoreDetail.push('+2');}

  // ③ 时支同五行 → +1
  const s3=B2E[hourBranch]===el;
  if(s3){detail.push('时支有根');scoreDetail.push('+1');}

  // ④ 年支同五行 → +1
  const s4=B2E[yearBranch]===el;
  if(s4){detail.push('年支有根');scoreDetail.push('+1');}

  // ⑤ 月支五行生日主（印） → +1
  const monthEle=B2E[monthBranch];
  const s5=b[el]===monthEle && !s1;
  if(s5){detail.push('月支生扶(印)');scoreDetail.push('+1');}

  // ⑥ 天干比劫（年/月/时干同日主五行）→ 各+1
  const otherStems=[yearStem,monthStem,hourStem];
  const s6a=otherStems.filter(s=>S2E[s]===el).length;
  if(s6a>0){detail.push('天干比劫×'+s6a);for(let i=0;i<s6a;i++)scoreDetail.push('+1');}

  // ⑦ 天干印星（年/月/时干生日主五行）→ 各+0.5
  const s7a=otherStems.filter(s=>b[el]===S2E[s]).length;
  if(s7a>0){detail.push('天干印星×'+s7a);for(let i=0;i<s7a;i++)scoreDetail.push('+½');}

  // ⑧ 地支藏干通根（本气+1 / 中余气+½）
  let hiddenRoots=0;
  const hiddenDetail=[];
  for(const[bn,br]of [['月',monthBranch],['日',dayBranch],['年',yearBranch],['时',hourBranch]]){
    const hs=BG[br];
    if(!hs)continue;
    const entries=[['主',hs['主']],['中',hs['中']],['余',hs['余']]];
    for(const[level,stem]of entries){
      if(!stem)continue;
      if(S2E[stem]===el){
        if(level==='主'){hiddenRoots++;hiddenDetail.push(bn+'支藏'+stem+'(本气)');}
        else{hiddenRoots+=0.5;hiddenDetail.push(bn+'支藏'+stem+'('+level+'气)');}
      }
    }
  }
  if(hiddenDetail.length>0){detail.push('藏干通根:'+hiddenDetail.join('|'));}

  // 算总分
  let score=s1?3:0;
  score+=s2?2:0;
  score+=s3?1:0;
  score+=s4?1:0;
  score+=s5?1:0;
  score+=s6a*1;
  score+=s7a*0.5;
  score+=hiddenRoots;
  score=Math.round(score*10)/10;

  const strength = score>=3 ? '身强' : '身弱';

  // ⑨ 调候：冬三月(亥子丑)无火喜火 / 夏三月(巳午未)无水喜水
  const coldMonths=['亥','子','丑'], hotMonths=['巳','午','未'];
  const allBranches=[yearBranch,monthBranch,dayBranch,hourBranch];
  const allStems=[yearStem,monthStem,dayStem,hourStem];
  const hasFireInChart=allBranches.some(br=>B2E[br]==='火')||allStems.some(s=>S2E[s]==='火');
  const hasWaterInChart=allBranches.some(br=>B2E[br]==='水')||allStems.some(s=>S2E[s]==='水');
  let tempNote='';
  if(coldMonths.includes(monthBranch)&&!hasFireInChart){tempNote='命局偏寒，喜火暖局（不论身强弱）。';}
  else if(hotMonths.includes(monthBranch)&&!hasWaterInChart){tempNote='命局偏燥，喜水润局（不论身强弱）。';}

  // ⑩ 格局参考
  let patternNote='';
  const allSameEleStems=allStems.filter(s=>S2E[s]===el).length;
  const allSameEleBranches=allBranches.filter(br=>B2E[br]===el||Object.values(BG[br]||{}).some(st=>S2E[st]===el)).length;
  if(allSameEleStems+allSameEleBranches>=5)patternNote='比劫林立——自我意识强，适合独立作业或创业。';
  const sealStems=allStems.filter(s=>b[el]===S2E[s]).length;
  if(sealStems>=2&&score>=3)patternNote+='印旺身强——学得快但容易想多做少，需实战练习推动。';

  // 喜用神
  const baseFav = strength==='身强'
    ? [rb[el],r[el],g[el]]
    : [b[el],el];
  const baseUnfav = strength==='身强'
    ? [b[el],el]
    : [rb[el],r[el],g[el]];

  // 调候修正：寒加火、燥加水进喜用
  let fav=[...baseFav], unfav=[...baseUnfav];
  if(coldMonths.includes(monthBranch)&&!hasFireInChart&&!fav.includes('火')){fav.unshift('火');unfav=unfav.filter(e=>e!=='火');}
  if(hotMonths.includes(monthBranch)&&!hasWaterInChart&&!fav.includes('水')){fav.unshift('水');unfav=unfav.filter(e=>e!=='水');}

  let favEles,unfavEles,tip;
  if(strength==='身强'){
    favEles='克泄耗——目标导向、能输出的环境。需要对抗感和完成感。';
    unfavEles='生扶——太安逸、太被照顾的岗位会让能量无处释放。';
    tip='能量充沛，喜有方向的挑战。适合需要决策力、抗压、推进力的岗位。忌被过度保护或无限等待。';
  } else {
    favEles='生扶——持续支持、有师父有同行、稳定节奏的环境。需要滋养。';
    unfavEles='克泄耗——过度竞争、独自承担、反复"榨取"输出会让你干涸。';
    tip='能量需要外部支持，喜稳定滋养的环境。适合深耕型、需要持续积累的场景。忌孤军作战。';
  }
  if(tempNote) tip=tempNote+' '+tip;

  return {
    strength, score, detailText: detail.join(' + '),
    scoreBreakdown: scoreDetail.join(' '),
    isMonthSameEle:s1, isDaySameEle:s2, isHourSameEle:s3, isYearSameEle:s4, isMonthGeneratesMe:s5,
    fav, unfav, favEles, unfavEles, tip,
    tempNote, patternNote,
    hasDryness:coldMonths.includes(monthBranch)&&!hasFireInChart,
    hasDampness:hotMonths.includes(monthBranch)&&!hasWaterInChart
  };
}

function getFavorable(dayElement, strResult) {
  const favInfo = strResult.fav.map(e=>favElemToIndustry(e));
  const unfavInfo = strResult.unfav.map(e=>favElemToIndustry(e));
  return {
    fav:strResult.fav,unfav:strResult.unfav,
    favEles:strResult.favEles,unfavEles:strResult.unfavEles,
    tip:strResult.tip,
    favInfo,unfavInfo
  };
}

function favElemToIndustry(el) {
  const map = {
    金:'金主结构与精密——后端/风控/法律/审计/投行/数据分析',
    木:'木主生发与创意——投资/品牌/教育/设计/内容/自媒体',
    水:'水主流动与深度——咨询/学术/媒体/交易/心理/策略',
    火:'火主表达与外放——前端/市场/销售/内容/品牌/演艺',
    土:'土主承载与统筹——产品/运营/管理/行政/银行/HR'
  };
  return map[el]||'';
}

// ============================================================
// 行业深度分析数据 (5行业 × 5日主)
// ============================================================
const INDUSTRY_DATA = {
  '互联网': {
    name:'互联网/科技', overview:'互联网不是一种五行——前端火、后端金、中台土。同一栋楼，脚下三套五行。不是这个行业合不合你——是你在这一层合不合。',
    types: {
      '金':{
        rating:'high', ratingText:'⭐⭐⭐ 高适配', ratingNote:'金得金扶——后端、数据是你的主场',
        pro:'后端、数据平台、算法架构。逻辑与系统天然同频，架构感在线。你的热情不长在嘴上，长在精度里。',
        con:'前端、创意、销售。火克金——你的精密在那边不被看见。字距调到像素级，调完说不出为什么。',
        roles:'后端开发 / 数据分析 / 算法工程 / 基础架构 / 技术管理',
        shortTerm:'往深度走——不要横向换赛道。后端做深，数据做到别人实现不了的精度。你在互联网的唯一筹码，是你做出别人做不出的系统。',
        longTerm:'从单点深度转向架构级影响力。数据平台负责人、技术VP、独立架构顾问——金日主在互联网的终点不是最会写代码的那个人，是制定系统的规则。',
        harmonize:'金日主困在前端。不是废了——把组件库维护、前端架构、性能优化做到别人做不到的精度。你在靠近金的方向，不需要辞职。'
      },
      '木':{
        rating:'mid', ratingText:'⭐⭐ 中等适配', ratingNote:'木得水生——互联网里有你的土壤，但不是所有岗位都适合',
        pro:'产品创新、品牌内容、增长策略。木主生发——新项目从零到一，直觉告诉你这个东西能不能长。',
        con:'纯后端、数据、合规运营。金克木——代码评审和系统逻辑不关心什么东西可以长。被流程反复修剪的不是工作量，是生长的意愿。',
        roles:'产品经理(创新型) / 品牌营销 / 社区运营 / 用户增长 / 内部创新孵化',
        shortTerm:'找互联网里有生长空间的岗位——产品创新、增长、品牌。避开纯执行和纯后端。你不是不会写代码——是代码不让你长。',
        longTerm:'从单点产品走向创意主导角色——品牌总监、创新孵化负责人、创业者。木日主在互联网的终点不是CTO，是不能被归类的那个人。',
        harmonize:'木日主被困在不太适合的岗位。在现有岗位种一棵你自己的树——内部创新提案、新人培训体系、开源项目。制度是围墙，围墙内也可以长树。'
      },
      '水':{
        rating:'mid', ratingText:'⭐⭐ 中等适配', ratingNote:'水得金生——互联网的底层是你的深度，但表层的快节奏是干涸',

function getEnergyCycle(dayElement, birthMonth) {
  const monthMap = {1:'冬季·水旺',2:'冬末·水木交',3:'春季·木旺',4:'春末·木火交',5:'夏季·火旺',6:'夏末·火土交',7:'盛夏·火旺',8:'夏末·火土交',9:'秋季·金旺',10:'秋末·金水交',11:'冬季·水旺',12:'冬中·水旺'};
  const elSeason = {
    '木':{strong:[1,2,3,4],weak:[7,8],tip:'春冬为顺——木得水生。农历十月到次年三月是你能量上升周期。夏天注意耗散——不是不能做事，是需要比平时更多的有意识补给。'},
    '火':{strong:[4,5,6,7],weak:[10,11,12],tip:'春夏为顺——火得木生。四月到七月让你事半功倍。冬天注意蓄力——不是低谷，是让你为明年做准备的阶段。'},
    '土':{strong:[3,6,9,12],weak:[1,2],tip:'四季末为顺——辰未戌丑月是土天然有力的节点。土的能量不像木火那样爆发，但持续稳定。'},
    '金':{strong:[7,8,9,10],weak:[4,5,6],tip:'秋冬为顺——金得土生。七月到十一月是你的黄金期。夏天可以储备——做不需要太多精度的前期准备。'},
    '水':{strong:[10,11,12,1],weak:[3,4,5,6],tip:'秋冬为顺——水得金生。十月到次年二月是你能量最足的时段。春夏多观察——你在深度积累，不是在停滞。'}
  };
  const season = elSeason[dayElement];
  const currentMonthEnergy = season.strong.includes(birthMonth) ? '✓ 你出生在能量高位' : season.weak.includes(birthMonth) ? '△ 你出生在能量低位——更需要在日常中主动补给' : '— 你出生在能量转换期';
  return {
    birthPeriod: monthMap[birthMonth]||'',
    birthNote: currentMonthEnergy,
    strongMonths: season.strong.map(m=>monthMap[m]).join('、'),
    weakMonths: season.weak.map(m=>monthMap[m]).join('、'),
    tip: season.tip
  };
}

    '金':{best:'后端/风控/投行/法律/数据分析', why:'金主精密——逻辑是你进入任何新领域的默认语言。找到需要结构化和精密度的工作环境。', step:'第一步：在现岗位找到最需要精密度和逻辑的部分——做到别人做不到的程度。用专业度说话，比三份简历更有效。下一步：去一个以精密为核心竞争力的领域。'},
    '水':{best:'咨询/学术/交易/媒体/心理', why:'水主深度——从一个宽泛的岗位转到一个需要钻研的岗位是最自然的方向。你的深度是你最不可替代的东西。', step:'第一步：在现工作中找到你最能往下挖的主题——把它当成研究课题来做。发表你的见解——哪怕只在内部。下一步：带着你的深度去敲需要深度的那扇门。'}
  };

function getIndustryMatrix(dayElement, indName) {
  // Auto-generate comparison for all 5 day masters in this industry
  const allEls = ['金','木','水','火','土'];
  const elNames = {金:'金',木:'木',水:'水',火:'火',土:'土'};
  const elEmojis = {金:'⚙️',木:'🌱',水:'🌊',火:'🔥',土:'🏛️'};
  // Ratings from INDUSTRY_DATA
  const ind = INDUSTRY_DATA[indName];
  const ratings = {};
  for (const el of allEls) {
    const td = ind.types[el];
    ratings[el] = {rating:td.rating, text:td.ratingText, note:td.ratingNote, elName:elNames[el], emoji:elEmojis[el]};
  }
  return {ratings, currentEl:dayElement};
}

function getYearEnergy(dayElement, indName) {
  const now = new Date();
  const year = now.getFullYear();
  const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const ELE = {甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水'};
  const yearStem = STEMS[(year-4)%10];
  const yearBranch = BRANCHES[(year-4)%12];
  const yearEle = ELE[yearStem];
  const yearFull = yearStem+yearBranch+'年';

  const g={木:'火',火:'土',土:'金',金:'水',水:'木'};
  const b={木:'水',火:'木',土:'火',金:'土',水:'金'};
  const rb={木:'金',火:'水',土:'木',金:'火',水:'土'};

  let relation, advice;
  if(yearEle === dayElement) {relation='年运与日主同五行——能量平稳，适合深耕积累。不是爆发年，但每一步都扎实。';}
  else if(b[dayElement] === yearEle) {relation='年运生你的日主——好年。外部能量在滋养你，适合启动新项目、换方向、提出升职。';}
  else if(rb[dayElement] === yearEle) {relation='年运克你的日主——挑战年。不是不能做事，但会比平时多看三分风险和代价。忌冲动决策，宜稳。';}
  else if(g[dayElement] === yearEle) {relation='你的日主生年运——输出年。适合教学、分享、搭建体系。注意在输出中保持能量回流，不要只出不进。';}
  else {relation='年运与你日主无功无过——平稳年。没有特别的顺或逆，做事靠自己基本功。';}

  return {yearFull, yearEle, relation, advice};
}
